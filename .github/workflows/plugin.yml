name: "Build Plugin"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (1.2.3 or v1.2.3)"
        required: true
        type: string

      branch:
        description: "Branch to build and push version change to"
        required: true
        default: main
        type: string

      create_release:
        description: "Create release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: plugin-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  plugin:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          lfs: true

      - name: Set plugin version
        shell: pwsh
        run: ./set-version.ps1 "${{ inputs.version }}"

      - name: Commit version change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --all
          git checkout ${{ inputs.branch }}
          $changes = $(git status -s)
          if ($changes) {
            git add CMakeLists.txt
            git commit -m "chore: bump version to ${{ inputs.version }} [skip ci]"
            git push origin ${{ inputs.branch }}
          } else {
            echo "No changes to commit"
          }

      - name: Set up MSVC
        uses: ./.github/actions/msvc-dev-cmd
        with:
          arch: x86

      - name: Compile plugin
        run: |
          cmake . --preset MP-Release -DPROJECT_VERSION="${{ inputs.version }}"
          cmake --build --preset MP-Release

      - name: Find plugin
        run: |
          # Find VDF first, fallback to DLL
          $plugin_path = Get-ChildItem -Recurse -Include *.vdf, *.dll -File |
            Sort-Object { $_.Extension -eq ".vdf" } -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          echo "Found plugin path: $plugin_path"

          # Normalize path
          $root = (Resolve-Path ".").Path + "\"
          $plugin_path = $plugin_path.Replace($root, "")
          $plugin_path = $plugin_path.Replace("\", "/")

          echo "plugin_path=$plugin_path" >> $env:GITHUB_ENV

      - name: Upload plugin as artifact
        if: ${{ !inputs.create_release }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ inputs.version }}
          path: ${{ env.plugin_path }}
          if-no-files-found: error

      - name: Release plugin
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: ${{ env.plugin_path }}
